# Scenario 1: environment pipeline (dev -> test -> prod).
#
# Every environment runs the same reusable stage (_env-stage.yml); only the
# GitHub Environment variables differ. `plan` always runs. `apply` runs for dev
# on every run, and for test/prod only on the default branch (never on PRs).
name: env-pipeline
run-name: "env-pipeline · ${{ github.event_name }} · ${{ github.ref_name }}"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# One run per ref at a time. PR runs are superseded by newer pushes; runs on
# main queue instead, so an in-flight apply is never cancelled halfway.
concurrency:
  group: env-pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dev:
    uses: ./.github/workflows/_env-stage.yml
    with:
      environment: dev
      apply: true

  test:
    needs: dev
    uses: ./.github/workflows/_env-stage.yml
    with:
      environment: test
      # `env` isn't available in `with:`, so the condition is repeated inline.
      apply: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}

  prod:
    # A skipped apply inside `test` still leaves the `test` call successful,
    # so prod's plan runs on PRs too.
    needs: test
    uses: ./.github/workflows/_env-stage.yml
    with:
      environment: prod
      apply: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
